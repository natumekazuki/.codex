name: Repository CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install SQLite on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install sqlite --version=3.53.4 --no-progress --yes
      - name: Run unit tests
        run: >-
          python -m unittest
          skills/contract-closure/scripts/test_candidate_snapshot.py
          skills/contract-closure/scripts/test_review_brief.py
          skills/audit-codex-work-quality/scripts/test_collect_session_evidence.py
          skills/audit-codex-work-quality/scripts/test_audit_history.py
      - name: Compile Python entry points
        run: >-
          python -m py_compile
          skills/contract-closure/scripts/candidate_snapshot.py
          skills/contract-closure/scripts/review_brief.py
          skills/audit-codex-work-quality/scripts/collect_session_evidence.py
          skills/audit-codex-work-quality/scripts/audit_history.py

  routing-tests:
    name: Subagent routing tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run subagent routing tests
        shell: pwsh
        run: ./hooks/test-subagent-routing.ps1
