# Example agent registry snippet for Codex user config.
# Copy only the agents you actually want to register.

[agents]
max_concurrent_threads_per_session = 5
max_depth = 1
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "medium"

[agents.general_sol]
config_file = "agents/general_sol.toml"

[agents.general_luna]
config_file = "agents/general_luna.toml"

[agents.test_value_luna]
config_file = "agents/test_value_luna.toml"

[agents.test_value_sol]
config_file = "agents/test_value_sol.toml"
