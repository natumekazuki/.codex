# Example agent registry snippet for Codex user config.
# Copy only the agents you actually want to register.

[agents]
max_concurrent_threads_per_session = 24
max_depth = 1
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "high"

[agents.general_astra]
config_file = "agents/general_astra.toml"

[agents.general_sol]
config_file = "agents/general_sol.toml"

[agents.general_luna]
config_file = "agents/general_luna.toml"
