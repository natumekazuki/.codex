# Portable profile layer for Codex 0.134.0 and later.
# Install as $CODEX_HOME/sol.config.toml, then use: codex --profile sol
model = "gpt-6-sol"
model_reasoning_effort = "medium"
service_tier = "default"

[features]
fast_mode = false

[agents]
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "high"
