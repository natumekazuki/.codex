# Portable profile layer for Codex 0.134.0 and later.
# Install as $CODEX_HOME/astra.config.toml, then use: codex --profile astra
model = "gpt-6-astra"
model_reasoning_effort = "low"
service_tier = "default"

[features]
fast_mode = false

[agents]
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"
