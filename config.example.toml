# Portable Codex user config example.
# Keep the real config.toml local. Copy only the sections you want to merge.

model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
service_tier = "default"
personality = "pragmatic"
project_doc_max_bytes = 131072

# 組み込み指示をリポジトリの英語版へ置き換える。共有例には端末固有のパスを記載せず、ユーザー設定では作業コピーの絶対パスへ置き換える。
model_instructions_file = "C:\\path\\to\\repository\\.codex\\model-instructions-withmate.md"

[features]
fast_mode = false
unified_exec = true
shell_snapshot = true
apps = true
personality = true
multi_agent = true
prevent_idle_sleep = true
guardian_approval = true
hooks = true
goals = true
multi_agent_v2.min_wait_timeout_ms = 120000
multi_agent_v2.default_wait_timeout_ms = 120000

[tui]
status_line = ["model-with-reasoning", "current-dir", "model", "project-name", "git-branch", "run-state", "context-remaining", "context-used", "five-hour-limit", "weekly-limit", "codex-version", "context-window-size", "used-tokens", "total-input-tokens", "total-output-tokens", "session-id", "fast-mode", "thread-title", "task-progress"]

[windows]
sandbox = "elevated"

[desktop]
ambient-suggestions-enabled = false
composerEnterBehavior = "cmdIfMultiline"
conversationDetailMode = "STEPS_COMMANDS"
show-context-window-usage = true

[desktop.open-in-target-preferences]
global = "fileManager"

[agents]
max_concurrent_threads_per_session = 24
max_depth = 1
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "medium"

# WithMate 6.3.29 supplies Memory and Glossary HTTP MCP connections per Session.
# Do not persist their URLs or short-lived tokens in this config.
# Manual STDIO is for development/diagnostics only; see the WithMate runbooks.
