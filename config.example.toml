# Portable Codex user config example.
# Keep the real config.toml local. Copy only the sections you want to merge.

model = "gpt-6-astra"
model_reasoning_effort = "low"
service_tier = "default"
personality = "pragmatic"
project_doc_max_bytes = 131072

[features]
fast_mode = false
unified_exec = true
shell_snapshot = true
apps = true
personality = true
multi_agent = true
prevent_idle_sleep = true
guardian_approval = true
hooks = true
goals = true
multi_agent_v2.min_wait_timeout_ms = 120000
multi_agent_v2.default_wait_timeout_ms = 120000

[tui]
status_line = ["model-with-reasoning", "current-dir", "model", "project-name", "git-branch", "run-state", "context-remaining", "context-used", "five-hour-limit", "weekly-limit", "codex-version", "context-window-size", "used-tokens", "total-input-tokens", "total-output-tokens", "session-id", "fast-mode", "thread-title", "task-progress"]

[windows]
sandbox = "elevated"

[desktop]
ambient-suggestions-enabled = false
composerEnterBehavior = "cmdIfMultiline"
conversationDetailMode = "STEPS_COMMANDS"
show-context-window-usage = true

[desktop.open-in-target-preferences]
global = "fileManager"

[agents]
max_concurrent_threads_per_session = 24
max_depth = 1
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

# WithMate installs the `withmate-memory` shim.
# Keep this server optional so Codex can start when WithMate is unavailable;
# the runbook owns the bounded CLI fallback rules.
[mcp_servers.withmate-character-context]
command = "withmate-memory"
args = ["mcp-server"]
env_vars = [
  "WITHMATE_AGENT_RUNTIME_BINDING_REFERENCE",
  "WITHMATE_AGENT_RUNTIME_BINDING_REQUIRED",
  "WITHMATE_AGENT_RUNTIME_TURN_CAPABILITY",
  "WITHMATE_MEMORY_RUNTIME_APPLICATION_INSTANCE_ID",
  "WITHMATE_MEMORY_RUNTIME_GENERATION_ID",
]
enabled = true
required = false

# WithMate installs the `withmate-glossary` shim and managed Skill.
# The server is Session-bound and can operate only on the primary checkout.
[mcp_servers.withmate-glossary]
command = "withmate-glossary"
args = ["mcp-server"]
env_vars = [
  "WITHMATE_AGENT_RUNTIME_BINDING_REFERENCE",
  "WITHMATE_AGENT_RUNTIME_BINDING_REQUIRED",
  "WITHMATE_AGENT_RUNTIME_TURN_CAPABILITY",
  "WITHMATE_MEMORY_RUNTIME_APPLICATION_INSTANCE_ID",
  "WITHMATE_MEMORY_RUNTIME_GENERATION_ID",
]
enabled = true
required = false
