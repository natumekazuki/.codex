# Portable Codex user config example.
# Keep the real config.toml local. Copy only the sections you want to merge.

model = "gpt-5.6"
model_reasoning_effort = "medium"
model_personality = "pragmatic"
personality = "pragmatic"
project_doc_max_bytes = 131072

[features]
unified_exec = true
shell_snapshot = true
apps = true
personality = true
multi_agent = true
prevent_idle_sleep = true
guardian_approval = true
hooks = true
goals = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "model", "project-name", "git-branch", "run-state", "context-remaining", "context-used", "five-hour-limit", "weekly-limit", "codex-version", "context-window-size", "used-tokens", "total-input-tokens", "total-output-tokens", "session-id", "fast-mode", "thread-title", "task-progress"]

[windows]
sandbox = "elevated"

[desktop]
ambient-suggestions-enabled = false
composerEnterBehavior = "cmdIfMultiline"
conversationDetailMode = "STEPS_COMMANDS"
show-context-window-usage = true

[desktop.open-in-target-preferences]
global = "fileManager"

# WithMate installs the `withmate-memory` shim and managed Skill.
# Keep this server optional so Codex can start when WithMate is unavailable;
# the Skill owns the bounded CLI fallback rules.
[mcp_servers.withmate-character-context]
command = "withmate-memory"
args = ["mcp-server"]
enabled = true
required = false

# WithMate installs the `withmate-glossary` shim and managed Skill.
# The server is Session-bound and can operate only on the primary checkout.
[mcp_servers.withmate-glossary]
command = "withmate-glossary"
args = ["mcp-server"]
enabled = true
required = false
