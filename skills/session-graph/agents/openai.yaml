interface:
  display_name: "Session Graph"
  short_description: "WithMate MCPで要求・判断・現在地を共有し、必要な文脈を復元する"
  default_prompt: "$session-graph を使い、通常作業では文脈を復元して必要な指示を先行記録し、背景Memory/Affect管理では元Mainの共有Graphを参照するだけにしてください。"
dependencies:
  tools:
    - type: "mcp"
      value: "withmate-session-graph"
      description: "WithMateが現在のSessionへ提供するSession Graph MCP"
policy:
  allow_implicit_invocation: true
